# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION TEMPLATE
# Place in: /etc/nginx/sites-available/aegis-api.conf
# ==============================================================================

server {
    listen 80;
    server_name api.minhmcpc.io.vn;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket / Keep-alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Truyền chính xác IP thực của client tới Aegis Fastify
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Cloudflare
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Giới hạn kích thước payload
    client_max_body_size 10M;
}
